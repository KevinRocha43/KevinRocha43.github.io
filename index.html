<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pvn · Plantillas de incidentes SOC</title>
<style>
:root{--bg:#eaf4fb;--surface:#fff;--text:#1b2733;--muted:#5b6b7a;--line:#cfdbe5;--accent:#00a8e0;--head:#81f499;--foot:#508aa8;--ph:#fff3c4;--phtext:#7a5b00;--ok:#1e8e4e;--bad:#c0392b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px}
header{background:var(--head);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

main{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:16px;padding:16px;max-width:1350px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
button{width:auto;cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent)}
button.sec{background:transparent;color:var(--text);border-color:var(--line)}
button.mini{padding:3px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:flex-end}
.out h2{font-size:16px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.out h2:first-child{margin-top:0}
.out h2.md{border-bottom:2px solid var(--accent);padding-bottom:3px}
.box{border:1px dashed var(--line);border-radius:6px;padding:10px;line-height:1.5}
.box p{margin:0 0 .6em}.box p:last-child{margin:0}.box ul{margin:.3em 0}
.ph{background:var(--ph);color:var(--phtext);padding:0 3px;border-radius:3px}
table.mail{border-collapse:collapse;border:2px solid #000;text-align:center;width:100%;color:#000;background:#fff}
table.mail th{background:#00a8e0;color:#fff;border:2px solid #000;padding:5px}
table.mail td{border:2px solid #000;padding:5px}
.mailwrap{overflow-x:auto;color:#000;background:#fff;padding:10px;border-radius:6px;font-family:Arial,sans-serif}
.mailwrap .ph{background:#fff3c4;color:#7a5b00}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.sec-h h3{margin:0;font-size:14px}
.banner{border-left:4px solid var(--bad);background:var(--ph);padding:8px 10px;margin:8px 0;border-radius:4px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
footer{background:var(--foot);color:#fff;padding:14px 16px;margin-top:8px}
footer input{background:var(--surface);max-width:200px}
footer .row{flex-wrap:wrap}footer label{color:#dbe8f0}

.toast.on{opacity:1}

</head>
<body>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1200); };
const defang = s => s.replace(/[\[\]]/g, '');           // 192[.]168[.]2[.]1 -> 192.168.2.1
const SEN = /\u0001(.*?)\u0002/g;                        // marcas de "campo vacío"
const plain = s => s.replace(SEN, '[$1]');               // para copiar
const phHtml = s => s.replace(SEN, (m, p) => `<span class="ph">[${p}]</span>`);

// {{clave}} o {{clave|texto si vacío}}
function fill(t, v, escape){
  return t.replace(/\{\{(\w+)(?:\|([^}]*))?\}\}/g, (m, k, ph) => {
    const x = (v[k] || '').trim();
    return x ? (escape ? esc(x) : x) : `\u0001${ph || k}\u0002`;
  });
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Copiado');
}
async function copyHtml(el){   // correo: HTML con formato + texto plano
  const html = el.innerHTML, text = el.innerText;
  try { await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([text], {type:'text/plain'})})]); toast('Copiado'); }
  catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); const ok = document.execCommand('copy'); s.removeAllRanges(); toast(ok ? 'Copiado' : 'No se pudo copiar'); }
}

/* Copia solo la tabla del correo como imagen PNG (sin librerías, funciona sin internet) */
async function copyImage(el){
  const tb = el.querySelector('table'); if (!tb) return toast('Este correo no tiene tabla');
  try {
    const w = tb.offsetWidth, h = tb.offsetHeight, k = 2, c = tb.cloneNode(true); c.style.width = w + 'px';
    const xml = new XMLSerializer().serializeToString(c);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w*k}" height="${h*k}" viewBox="0 0 ${w} ${h}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
    const cv = document.createElement('canvas'); cv.width = w*k; cv.height = h*k; const cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast('Imagen copiada');
  } catch { toast('No se pudo copiar como imagen'); }
}

/* Markdown mínimo: **negrita**, *cursiva*, `código`, listas "- ", citas "> ", párrafos */
function md(src){
  const inl = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/`(.+?)`/g, '<code>$1</code>');
  let out = '', para = [], ul = false;
  const flush = () => { if (para.length) { out += '<p>' + para.map(inl).join('<br>') + '</p>'; para = []; } if (ul) { out += '</ul>'; ul = false; } };
  for (const l of esc(src).split('\n')) {
    if (!l.trim()) flush();
    else if (/^- /.test(l)) { if (para.length) flush(); if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + inl(l.slice(2)) + '</li>'; }
    else if (/^&gt; /.test(l)) { flush(); out += '<div class="banner">' + inl(l.slice(5)) + '</div>'; }
    else { if (ul) flush(); para.push(l); }
  }
  flush(); return phHtml(out);
}

/* ================= PLANTILLAS ================= */
const SEV = ['Critica','Alta','Media','Baja'];
const sevBox = s => SEV.map(x => `${x === s ? '☒' : '☐'}${x}`).join(' ');
// F(clave, etiqueta, [opciones] | {o,d} | valorPorDefecto). Se limpian [] en claves que empiezan con ip/host
const F = (k, l, x) => ({k, l, df: /^(ip|host)/.test(k), ...(Array.isArray(x) ? {o: x} : (x && typeof x === 'object') ? x : x !== undefined ? {d: x} : {})});
const SEVF = d => F('sev', 'Severidad', {o: SEV, d});
const TIPO = F('tipo', 'Interno / Externo', ['Externo','Interno']);
const PERSONA = [F('usuario','Usuario ejecutor'), F('nombre','Nombre de usuario'), TIPO, F('cargo','Cargo'), F('empresa','Empresa'), F('jefe','Jefe')];

**Nombre:** {{nombre}}
**Cargo:** {{cargo}}
**Empresa:** {{empresa|N/A}}

const cierreAut = `### (2)
**Autorización para cierre:** Se da Vo.Bo. para el cierre del caso por parte de Supervisión [Nombre].`;

### (2)

${ficha}

### (4)
*(en caso de aplicar)*

### (5)

*En caso de ser justificada la actividad...*

## CIERRE
### (1)
**Conclusión:** {{nombre}} confirma que el movimiento **(Alta/baja/cambio)** corresponde a una actividad válida debido a **[detalle de la actividad]**. Por lo anterior se procede al cierre del caso.
${cierreAut}`;

const abc = (ctx, title, extra, rows) => ({
  fields: [F('fecha','Fecha'), F('alerta','Alerta'), F('normativa','Normativa'), ...PERSONA, SEVF('Alta'), F('mov','Tipo de movimiento'), F('afectado','Usuario afectado'), ...extra],
  title,
  mail: {
    intro: `{{greet}},<br><br>Les notificamos que se ha realizado un cambio en ${ctx} <b>{{alerta}}</b>, este movimiento fue realizado por el usuario <b>{{usuario}}</b> afectando la cuenta <b>{{afectado}}</b> realizando un <b>{{mov}}</b>. Para fines de validación, <b>solicitamos</b> su apoyo compartiendo la justificación de la actividad mediante el folio de <b>REQ/CHG/INC</b> que respalde su ejecución.<br><br>Adjuntamos detalle del evento:`,
    rows: [['Severidad','@sev'],['Tipo de amenaza:','<b>{{alerta}}</b>'],['Normativa:','{{normativa|N/A}}'],['Fecha:','{{fecha}}'],
      ['Usuario ejecutor:','{{usuario}}','Nombre de Usuario:','{{nombre}}'],['Usuario afectado:','{{afectado}}','Tipo de movimiento:','{{mov}}'], ...rows]
  },
  doc: abcDoc(ctx)
});

const TEMPLATES = {
  'VPN': {
    fields: [F('modo','Enterprise / Mobile',['Enterprise','Mobile']), F('alerta','Alerta'), F('normativa','Normativa'), F('fecha','Fecha'), F('ipo','Src IP'), F('ipd','Dest IP'), F('pais','País','México'), TIPO,
      F('usuario','User'), F('nombre','Nombre'), F('empresa','Compañía'), F('jefe','Jefe')],
    title: ['{{alerta}}_{{usuario}}_{{ipo}}'],
    names: ['Cisco_Talos_{{ipo}}','IBM_X_Force_{{ipo}}','Virus_Total_{{ipo}}','WEBPHONE_{{usuario}}'],
    doc: `### (1)
**Descripción del evento:**
Se detecta conexión del usuario **{{usuario}}**, mediante VPN {{modo}} con IP origen: **{{ipo}}** correspondiente al país {{pais}} con destino **{{ipd}}**; se inicia validación del evento.
### (2)
**Validación del evento:**
Se realiza el análisis de la IP de origen **{{ipo}}** mediante distintas fuentes de inteligencia:

**Validación de excepciones**

### (5)
**Seguimiento:** Se envía correo de seguimiento solicitando respuesta al usuario del evento notificado previamente. *(en caso de aplicar)*
### (6)
**Validación de la respuesta:** Se recibe respuesta por parte del [Usuario/Jefe] indicando [reconoce/no reconoce] la actividad.

*En caso de no reconocer la actividad...*

- Solicitar los bloqueos con las áreas correspondientes... y documentar acciones.`
  },

  'ACPS': {
    fields: [F('fecha','Fecha'), F('alerta','Alerta'), F('normativa','Normativa'), F('usuario','Usuario ejecutor'), F('nombre','Nombre usuario'), F('priv','Usuario privilegiado','admin'),
      TIPO, F('cargo','Cargo'), F('empresa','Empresa'), F('jefe','Jefe'), F('ipo','IP origen'), F('ipd','IP destino'), SEVF('Alta')],

    note: '**ATENCIÓN:** En el caso específico del usuario `s14275` (alerta `VDI_USUARIOS:ACPS`, IP Origen: `201.130.47.32`), se deberá cerrar como **FALSO POSITIVO**.',
    mail: {

    },
    doc: `### (1)
**Descripción del evento:**
Se detecta evento por acceso a cuenta privilegiada al elemento **{{alerta}}** con IP origen interna **{{ipo}}**, realizado por el usuario {{usuario}} {{nombre}} con el usuario privilegiado **{{priv}}**. Se inicia la validación del evento.
### (2)
Se realiza la validación del usuario
- **Webphone:** Validación de los datos del usuario

${ficha}
### (3)
**Notificación:** Se realiza notificación al usuario ejecutor identificado para validación y justificación del acceso detectado.
### (4)
**Seguimiento:** [Indicar cualquier información respecto a la atención del evento en proceso]
### (5)
**Validación de la respuesta:** Se recibe respuesta por parte de {{nombre}} indicando [detalle de la respuesta].

*En caso de ser justificada la actividad... Si hay folio: Validar con TII*
### (6) Respuesta válida
**Justificación:** El usuario confirma y justifica la actividad notificada, se adjunta el folio de respaldo de la actividad [Folio] y se determina como evento legítimo por lo que se procede al cierre del caso.
### (6) Respuesta no válida
**Justificación:** No se cuenta con una justificación válida con respecto al acceso a la cuenta privilegiada, por lo que se escala con el equipo de Tier II para su seguimiento.

*Teniendo las validaciones pasar a tarea de cierre... No validado, escalar TII.*
## CIERRE
### (7)
**Conclusión:** Se confirmó que el evento corresponde a una actividad legítima autorizada por parte del usuario.
### (8)
**Aprobación:** Se da Vo.Bo. para el cierre del caso por parte de Supervisión [Nombre].`
  },

  'App abc': abc('la aplicación', ['Case ####_[Aplicación]: ABC_Usuarios_{{host}}', '{{alerta}}: ABC de Usuarios_{{usuario}}_{{host}}'], [F('host','Host origen')], [['Hostname origen:','{{host}}']]),
  'DB abc': abc('la base de datos', ['Case ####_Base de Datos: ABC Usuarios_{{host}}', '{{alerta}}_{{usuario}}_{{host}}'],
    [F('host','Host'), F('objeto','Tipo de objeto'), F('usoso','Usuario de SO')], [['Host:','{{host}}'],['Usuario de SO:','{{usoso}}','Tipo de objeto:','{{objeto}}']]),

## CIERRE

**Conclusión:** Ingesta normalizada y validada sin afectación activa.
${cierreAut}`

      F('tipo','Interno / Externo',['Externo','Interno','No identificado']), F('cargo','Cargo'), F('host','Origen / host'), F('accion','Acción','LOGIN'), SEVF('Critica')],

/* ================= estado ================= */
let state = store.get('pvn2', {tpl: 'VPN', greet: 'Buenos días', data: {}});
if (!TEMPLATES[state.tpl]) state.tpl = Object.keys(TEMPLATES)[0];
const sel = $('#tpl');
sel.innerHTML = Object.keys(TEMPLATES).map(n => `<option>${esc(n)}</option>`).join('');
sel.value = state.tpl; $('#greet').value = state.greet;
const save = () => store.set('pvn2', state);

function values(){
  const v = {greet: state.greet}, d = state.data[state.tpl] || {};
  TEMPLATES[state.tpl].fields.forEach(f => v[f.k] = d[f.k] ?? f.d ?? (f.o ? f.o[0] : ''));
  return v;
}

/* limpia [] conservando la posición del cursor */
function cleanInput(el){
  const c = defang(el.value); if (c === el.value) return false;
  const before = el.value.slice(0, el.selectionStart), pos = defang(before).length;
  el.value = c; el.setSelectionRange(pos, pos); return true;
}

function buildForm(){
  const t = TEMPLATES[state.tpl], v = values();
  $('#form').innerHTML = t.fields.map(f => `<div><label>${esc(f.l)}</label>` + (f.o
    ? `<select data-k="${f.k}">${f.o.map(o => `<option ${o === v[f.k] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : `<input data-k="${f.k}" ${f.df ? 'data-defang' : ''} value="${esc(v[f.k])}">`) + '</div>').join('');
  $('#form').querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => {
    if (el.hasAttribute('data-defang')) cleanInput(el);
    (state.data[state.tpl] ||= {})[el.dataset.k] = el.value; save(); render();
  }));
  render();
}

/* ================= render ================= */
let docChunks = [];   // texto markdown crudo de cada sección, para copiar
function mailHtml(t, v){
  const m = t.mail; if (!m) return '';
  const TH = 'style="background:#00a8e0;color:#fff;border:2px solid #000;padding:5px"', TD = 'style="border:2px solid #000;padding:5px;color:#000;background:#fff"';
  const rows = m.rows.map(r => r[0] === '!' ? `<tr><th ${TH} colspan="4">${r[1]}</th></tr>`
    : r.length === 2 ? `<tr><th ${TH}>${r[0]}</th><td ${TD} colspan="3">${r[1] === '@sev' ? `<b>${sevBox(v.sev)}</b>` : fill(r[1], v, true)}</td></tr>`
    : `<tr><th ${TH}>${r[0]}</th><td ${TD}>${fill(r[1], v, true)}</td><th ${TH}>${r[2]}</th><td ${TD}>${fill(r[3], v, true)}</td></tr>`).join('');
  const table = rows ? `<table style="border-collapse:collapse;border:2px solid #000;text-align:center;width:100%;font-family:Arial,sans-serif"><thead><tr><th ${TH} colspan="4">Detalle del evento</th></tr></thead><tbody>${rows}</tbody></table>` : '';
  const outro = m.outro ?? 'Se anexa mayor detalle a continuación:<br><br>Quedo pendiente a sus comentarios<br>Saludos';
  return phHtml(`<div style="font-family:Arial,sans-serif;color:#000"><p>${fill(m.intro, v, true)}</p>${table}<p>${outro}</p></div>`);
}
function docHtml(t, v){
  docChunks = [];
  const full = fill(t.doc, v, false); if (!full.trim()) return '<p class="hint">Esta plantilla no tiene documentación definida.</p>';
  let html = `<h2>Documentación y cierre (markdown) <button class="mini" data-cpdoc="all">Copiar todo</button></h2>`;
  if (t.note) html += md(`> ${t.note}`);
  full.split(/^(?=#{2,3} )/m).forEach(ch => {
    const [first, ...rest] = ch.split('\n');
    if (first.startsWith('## ')) { html += `<h2 class="md">${phHtml(esc(first.slice(3)))}</h2>`; return; }
    const hasH = first.startsWith('### '), body = (hasH ? rest.join('\n') : ch).trim(), i = docChunks.push(plain(body)) - 1;
    html += `<div class="sec-h"><h3>${hasH ? phHtml(esc(first.slice(4))) : ''}</h3><button class="mini" data-cpdoc="${i}">Copiar</button></div><div class="box">${md(body)}</div>`;
  });
  docChunks.all = plain(full);
  return html;
}
function render(){
  const t = TEMPLATES[state.tpl], v = values();
  const titles = t.title.map(x => plain(fill(x, v, false)));
  const names = t.names ? `<h2>Para nombrar (evidencias)</h2><div class="box">${t.names.map(x => esc(plain(fill(x, v, false)))).join('<br>')}</div>` : '';
  $('#out').innerHTML =
    `<h2>Sugerencia de título <button class="mini" data-cptext="${esc(titles.join('\n'))}">Copiar</button></h2><div class="box">${titles.map(esc).join('<br>')}</div>` + names +
    (t.mail ? `<h2>Correo <span><button class="mini" data-cp="mail">Copiar</button> ${t.mail.rows.length ? '<button class="mini sec" data-cpimg="mail">Copiar tabla como imagen</button>' : ''}</span></h2><div class="mailwrap" id="mail">${mailHtml(t, v)}</div>` : '') +
    docHtml(t, v);
}

/* ================= eventos ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cp) { const el = document.getElementById(b.dataset.cp); el.tagName === 'CODE' ? copyText(el.textContent) : copyHtml(el); }
  else if (b.dataset.cpimg) copyImage(document.getElementById(b.dataset.cpimg));
  else if (b.dataset.cpdoc) copyText(docChunks[b.dataset.cpdoc]);
  else if (b.dataset.cptext !== undefined) copyText(b.dataset.cptext);
});
sel.onchange = () => { state.tpl = sel.value; save(); buildForm(); };
$('#greet').onchange = e => { state.greet = e.target.value; save(); render(); };
$('#clear').onclick = () => { state.data[state.tpl] = {}; save(); buildForm(); };

function gen(){ const a = $('#g_a').value.trim() || 'N/A', u = $('#g_u').value.trim() || 'N/A', i = $('#g_i').value.trim() || 'N/A';
  $('#g1').textContent = `${a}_${u}_${i}`; $('#g2').textContent = `${a}_${u}`; }
['g_a','g_u','g_i'].forEach(id => $('#' + id).addEventListener('input', e => { if (e.target.hasAttribute('data-defang')) cleanInput(e.target); gen(); }));
gen(); buildForm();
</script>
